name: Bug report
description: Something in SpektraMac doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Attach the photo if you can share it (zip it if GitHub won't take its file type). Photos can carry the place
        they were taken: share a copy without it if you'd rather.
      placeholder: |
        1. Open a photo
        2. Choose …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpektraMac version
      description: In SpektraMac › About SpektraMac, or the commit you built.
      placeholder: "1.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: In Apple menu › About This Mac.
      placeholder: "26.5"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      placeholder: MacBook Pro, M1 Pro, 16 GB
  - type: dropdown
    id: format
    attributes:
      label: The photo's format
      options:
        - Camera RAW
        - HEIC
        - JPEG
        - TIFF
        - PNG
        - Not about a photo
  - type: input
    id: film-paper
    attributes:
      label: Film and paper
      placeholder: Kodak Portra 400 on Kodak Portra Endura
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Anything in Window › Log (⌥⌘L) from when it happened.
      render: text
  - type: textarea
    id: spektrafilm
    attributes:
      label: Does it look different from Spektrafilm?
      description: If so, which version of Spektrafilm, and the settings you used in both.
