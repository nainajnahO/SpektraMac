name: Build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27, as the project needs: Xcode 26's compiler can't type-check some of the engine's
    # expressions in time. GitHub's image for it is a preview.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Build the app
        # Unsigned: the runner has no signing certificate, and nothing is distributed.
        run: >
          xcodebuild -project SpektraMac.xcodeproj -scheme SpektraMac -configuration Release
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test the engine
        id: test
        # The parity tests skip themselves: their reference data isn't in the repository (README).
        # PhotoOpeningTests renders through the app's engine, and reading those renders back crashes
        # the runner's virtual GPU driver (AppleParavirtGPU, in getBytes); they run on a Mac.
        # The log is kept for the next step.
        run: |
          set -o pipefail
          swift test --package-path Engine --skip PhotoOpeningTests 2>&1 | tee test.log
      - name: Say whether the parity tests ran
        # A parameterized parity test whose cases all cancelled still reads "passed" in the log, so
        # a green check doesn't say the app matches Spektrafilm: this says so on the run's page.
        if: always() && steps.test.outcome != 'skipped'
        run: |
          cancelled=$(grep -c "the parity tests need the reference data" test.log || true)
          if [ "$cancelled" -gt 0 ]; then
            message="Parity tests: not run. golden/, the reference data from Spektrafilm, isn't in the repository: $cancelled tests were cancelled, and the parameterized ones (chainMatchesPython and the like) show as passed though none of their cases ran."
          else
            message="Parity tests: run against golden/."
          fi
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Parity tests::$message"
