name: Build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27, as the project needs: Xcode 26's compiler can't type-check some of the engine's
    # expressions in time. GitHub's image for it is a preview.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Build the app
        # Unsigned: the runner has no signing certificate, and nothing is distributed.
        run: >
          xcodebuild -project SpektraMac.xcodeproj -scheme SpektraMac -configuration Release
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test the engine
        # The parity tests skip themselves: their reference data isn't in the repository (README).
        run: swift test --package-path Engine
      - name: Show crash reports
        if: failure()
        # A crash (such as in the GPU driver of the runner's virtual Mac) leaves its stack here.
        run: |
          for report in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$report" ] || continue
            echo "== $report"
            tail -n +2 "$report" | jq -r '.threads[] | select(.triggered) | .frames[] | "\(.imageIndex) \(.symbol // "?") +\(.symbolLocation // 0)"' 2>/dev/null | head -40
            tail -n +2 "$report" | jq -r '.usedImages | to_entries[] | "\(.key) \(.value.name // .value.path // "?")"' 2>/dev/null | head -60
          done
